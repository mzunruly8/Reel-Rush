<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelRush Arena 🎰</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Ultra&display=swap');
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 20px; 
        background: radial-gradient(circle at center, #0a0a1f 0%, #1a0a2a 30%, #2a0a3a 70%, #000 100%);
        background-attachment: fixed;
        color: #fff; font-family: 'Orbitron', monospace; min-height: 100vh;
        display: flex; flex-direction: column; align-items: center;
        box-shadow: inset 0 0 100px rgba(0,255,255,0.1);
        position: relative;
        overflow-x: hidden;
    }
    
    /* Animated neon background particles */
    body::before {
        content: '';
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            radial-gradient(2px 2px at 20px 30px, #00ffcc, transparent),
            radial-gradient(2px 2px at 40px 70px, #ff00ff, transparent),
            radial-gradient(1px 1px at 90px 40px, #ffff00, transparent),
            radial-gradient(1px 1px at 130px 80px, #00ccff, transparent);
        background-repeat: repeat;
        background-size: 200px 100px;
        animation: neonFloat 20s linear infinite;
        pointer-events: none;
        z-index: -1;
    }
    @keyframes neonFloat {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-100px) rotate(360deg); }
    }

    .header { 
        text-align: center; margin-bottom: 25px; 
        text-shadow: 0 0 20px #00ffcc, 0 0 40px #ff00ff;
        animation: headerPulse 3s ease-in-out infinite alternate;
    }
    @keyframes headerPulse {
        0% { filter: hue-rotate(0deg) brightness(1); }
        100% { filter: hue-rotate(60deg) brightness(1.2); }
    }
    
    h1 { 
        font-family: 'Ultra', serif; font-size: clamp(2.8em, 12vw, 5.5em); 
        background: linear-gradient(45deg, #ff00ff, #00ffcc, #ffff00, #ff6b6b, #00ccff);
        background-size: 300% 300%;
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; margin: 0;
        animation: rainbow 2s linear infinite, glow 0.5s ease-in-out infinite alternate;
        filter: drop-shadow(0 0 20px #ff00ff);
    }
    @keyframes rainbow {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    .status-bar {
        display: flex; justify-content: space-around; gap: 20px; flex-wrap: wrap; margin: 20px 0;
        background: linear-gradient(145deg, rgba(0,255,204,0.2), rgba(255,0,255,0.2));
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        padding: 20px; border-radius: 25px; max-width: 520px; width: 100%;
        border: 2px solid rgba(0,255,204,0.4);
        box-shadow: 
            0 0 30px rgba(0,255,204,0.3),
            inset 0 0 20px rgba(255,255,255,0.1);
    }
    .stat { 
        text-align: center; 
        text-shadow: 0 0 10px currentColor;
    }
    .stat-value { 
        font-size: 1.6em; font-weight: 900; 
        background: linear-gradient(45deg, #ffff00, #ff00ff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        animation: statGlow 1.5s ease-in-out infinite alternate;
    }
    @keyframes statGlow {
        0% { filter: brightness(1) drop-shadow(0 0 5px #ffff00); }
        100% { filter: brightness(1.3) drop-shadow(0 0 15px #ff00ff); }
    }

    .disclaimer { 
        font-size: 0.85em; opacity: 0.85; text-align: center; max-width: 420px; margin: 15px 0;
        background: linear-gradient(145deg, rgba(0,0,0,0.6), rgba(0,0,0,0.3));
        backdrop-filter: blur(15px); padding: 15px; border-radius: 15px; 
        border: 1px solid rgba(0,255,204,0.3);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        animation: disclaimerFloat 6s ease-in-out infinite;
    }
    @keyframes disclaimerFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
    }

    .mode-tabs {
        display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 25px 0; 
        max-width: 520px; width: 100%;
    }
    .tab-btn {
        flex: 1; min-width: 110px; padding: 15px 10px; 
        background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
        backdrop-filter: blur(15px); border: 2px solid rgba(0,255,204,0.5);
        border-radius: 30px; color: #fff; font-family: inherit; font-size: 0.95em; 
        font-weight: 800; cursor: pointer; transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
        position: relative; overflow: hidden;
        text-shadow: 0 0 10px rgba(0,255,204,0.5);
    }
    .tab-btn::before {
        content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.5s;
    }
    .tab-btn:hover::before { left: 100%; }
    .tab-btn.active, .tab-btn:hover { 
        background: linear-gradient(45deg, #00ffcc, #ff00ff, #ffff00);
        color: #000; transform: translateY(-3px) scale(1.05);
        box-shadow: 
            0 15px 40px rgba(0,255,204,0.5),
            0 0 50px rgba(255,0,255,0.4),
            inset 0 0 20px rgba(255,255,255,0.3);
        border-color: #ffff00;
        text-shadow: none;
    }

    .play-area { 
        min-height: 420px; display: flex; flex-direction: column; align-items: center; 
        padding: 25px; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
        border-radius: 30px; border: 1px solid rgba(0,255,204,0.2);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* Machine-specific neon styling */
    .classic-slots .reel { 
        background: linear-gradient(180deg, rgba(254,202,87,0.3), rgba(26,26,46,0.8));
        border: 3px solid #feca57; box-shadow: 
            inset 0 0 20px rgba(254,202,87,0.4),
            0 0 25px rgba(254,202,87,0.6);
    }
    .high-roller .reel { 
        background: linear-gradient(180deg, rgba(255,71,87,0.3), rgba(75,0,0,0.8));
        border: 3px solid #ff4757; box-shadow: 
            inset 0 0 25px rgba(255,71,87,0.5),
            0 0 30px rgba(255,71,87,0.7);
    }
    .multi-line .reel { 
        background: linear-gradient(180deg, rgba(0,184,148,0.3), rgba(15,47,15,0.8));
        border: 3px solid #00b894; box-shadow: 
            inset 0 0 20px rgba(0,184,148,0.4),
            0 0 25px rgba(0,184,148,0.6);
    }

    .symbol { 
        text-shadow: 0 0 10px currentColor; 
        filter: drop-shadow(0 0 5px currentColor);
    }
    .win-glow { 
        animation: glow 0.4s ease-in-out infinite alternate, rainbow 1s linear infinite !important;
        filter: brightness(1.5) drop-shadow(0 0 20px #ffff00) !important;
    }

    /* Wheel gets SPECIAL fluorescent love */
    .wheel-area .wheel { 
        width: 300px; height: 300px; border-radius: 50%; 
        border: 10px solid; border-image: linear-gradient(45deg, #00ffcc, #ff00ff, #ffff00) 1;
        box-shadow: 
            0 0 50px rgba(0,255,204,0.7),
            0 0 100px rgba(255,0,255,0.5),
            inset 0 0 50px rgba(255,255,255,0.1);
        animation: wheelIdle 3s ease-in-out infinite alternate;
    }
    @keyframes wheelIdle {
        0% { box-shadow: 0 0 50px rgba(0,255,204,0.7), 0 0 100px rgba(255,0,255,0.5); }
        100% { box-shadow: 0 0 70px rgba(0,255,204,0.9), 0 0 120px rgba(255,0,255,0.7); }
    }
    .wheel-area .pointer {
        filter: drop-shadow(0 0 10px #ffff00);
        animation: pointerBlink 1s ease-in-out infinite alternate;
    }
    @keyframes pointerBlink {
        0% { filter: brightness(1) drop-shadow(0 0 10px #ffff00); }
        100% { filter: brightness(1.5) drop-shadow(0 0 20px #ffff00); }
    }

    .controls { margin-top: 25px; text-align: center; }
    .spin-btn, .wheel-btn { 
        background: linear-gradient(45deg, #00ffcc, #ff00ff, #ffff00, #ff6b6b);
        background-size: 300% 300%; color: #000; border: none;
        padding: 18px 35px; font-size: 1.15em; font-weight: 900; border-radius: 50px; 
        cursor: pointer; font-family: inherit; margin: 8px; transition: all 0.4s;
        min-width: 150px; position: relative; overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,255,204,0.4);
        text-shadow: none;
        animation: buttonShine 2s linear infinite;
    }
    @keyframes buttonShine {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }
    .spin-btn::after, .wheel-btn::after {
        content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transition: left 0.6s;
    }
    .spin-btn:hover:not(:disabled)::after, .wheel-btn:hover:not(:disabled)::after { left: 100%; }
    .spin-btn:disabled, .wheel-btn:disabled { 
        opacity: 0.4; cursor: not-allowed; transform: none;
        box-shadow: none; animation: none;
    }
    .spin-btn:hover:not(:disabled), .wheel-btn:hover:not(:disabled) { 
        transform: translateY(-5px) scale(1.1); 
        box-shadow: 0 20px 50px rgba(0,255,204,0.6);
    }

    .message { 
        font-size: 1.5em; font-weight: 800; margin: 20px 0; min-height: 2.2em; 
        font-family: 'Ultra', serif; text-shadow: 0 0 15px currentColor;
        animation: msgFloat 2s ease-in-out infinite;
    }
    @keyframes msgFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
    }

    @media (max-width: 480px) {
        body { padding: 15px; }
        .status-bar { flex-direction: column; gap: 15px; }
        .mode-tabs { flex-direction: column; }
        .tab-btn { min-width: unset; padding: 18px 15px; }
        .wheel-area .wheel { width: 260px; height: 260px; }
    }
    
    .hidden { display: none !important; }
    @keyframes glow { 
        0%,100% { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor; }
        50% { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor; }
    }
</style>
</head>
<body>
    <div class="header">
        <h1>🎰 ReelRush Arena 🎰</h1>
        <div class="status-bar">
            <div class="stat"><div class="stat-value" id="credits">1000</div>Credits</div>
            <div class="stat"><div class="stat-value" id="prestige">1</div>Prestige</div>
            <div class="stat"><div class="stat-value" id="freeSpins">0</div>Free Spins</div>
        </div>
        <div class="disclaimer">🎮 97.7% RTP • Entertainment only • No cashouts or real-world value • Pure fun & prestige! 🎮</div>
    </div>

    <div class="mode-tabs">
        <button class="tab-btn active" data-mode="classic">Classic Slots</button>
        <button class="tab-btn" data-mode="highroller">Lucky 7 High Roller</button>
        <button class="tab-btn" data-mode="multiline">Multi-Line Party</button>
        <button class="tab-btn" data-mode="wheel">Lucky Land Wheel</button>
    </div>

    <div class="play-area" id="playArea">
        <!-- Classic Slots -->
        <div id="classic" class="classic-slots">
            <div class="reels-container">
                <div class="reel" id="reel1-classic"></div>
                <div class="reel" id="reel2-classic"></div>
                <div class="reel" id="reel3-classic"></div>
            </div>
            <div class="controls">
                <button class="spin-btn" id="spinClassic">SPIN (10cr)</button>
                <div class="message" id="msgClassic">Ready to win big!</div>
            </div>
        </div>

        <!-- High Roller -->
        <div id="highroller" class="high-roller hidden">
            <div class="reels-container">
                <div class="reel" id="reel1-hr"></div>
                <div class="reel" id="reel2-hr"></div>
                <div class="reel" id="reel3-hr"></div>
            </div>
            <div class="controls">
                <button class="spin-btn" id="spinHR">HIGH ROLLER (50cr)</button>
                <div class="message" id="msgHR">Feeling lucky? 🔥</div>
            </div>
        </div>

        <!-- Multi-Line -->
        <div id="multiline" class="multi-line hidden">
            <div class="reels-container">
                <div class="paylines">5 Paylines Active</div>
                <div class="reel" id="reel1-ml"></div>
                <div class="reel" id="reel2-ml"></div>
                <div class="reel" id="reel3-ml"></div>
            </div>
            <div class="controls">
                <button class="spin-btn" id="spinML">PARTY SPIN (25cr)</button>
                <div class="message" id="msgML">Let the party begin! 🎉</div>
            </div>
        </div>

        <!-- Lucky Land Wheel -->
        <div id="wheel" class="wheel-area hidden">
            <div class="wheel-container">
                <div class="wheel" id="fortuneWheel">
                    <div class="pointer"></div>
                </div>
            </div>
            <div class="controls">
                <button class="wheel-btn" id="spinWheelBtn">SPIN FREE!</button>
                <div class="message" id="wheelMsg">Free every 4 hours!</div>
            </div>
        </div>
    </div>

    <script>
        // Game State (97.7% RTP tuned)
        let gameState = {
            credits: parseInt(localStorage.getItem('reelrush-credits')) || 1000,
            prestige: parseInt(localStorage.getItem('reelrush-prestige')) || 1,
            freeSpins: parseInt(localStorage.getItem('reelrush-free')) || 0,
            totalWagered: parseInt(localStorage.getItem('reelrush-wagered')) || 0,
            lastWheel: localStorage.getItem('reelrush-lastwheel') || 0
        };

        // RTP 97.7% machines (bet:return ratios tuned)
        const machines = {
            classic: { 
                bet: 10, reels: 3, symbols: ['🍒','🍋','🍉','🔔','⭐','7️⃣'], 
                payout: {'🍒':2, '🍋':3, '🍉':4, '🔔':6, '⭐':8, '7️⃣':15}, 
                hitRate: 0.28, rtp: 0.977 
            },
            highroller: { 
                bet: 50, reels: 3, symbols: ['💎','🔥','💰','7️⃣','💥','⭐'], 
                payout: {'💎':5, '🔥':8, '💰':12, '7️⃣':50, '💥':20, '⭐':30}, 
                hitRate: 0.18, rtp: 0.977 
            },
            multiline: { 
                bet: 25, reels: 3, symbols: ['🎉','🎈','🎰','💎','⭐','7️⃣'], 
                payout: {'🎉':3, '🎈':4, '🎰':6, '💎':10, '⭐':15, '7️⃣':25}, 
                hitRate: 0.24, rtp: 0.977 
            }
        };

        let currentMode = 'classic';
        let spinning = false;
        let reelStates = {};

        // UI Elements
        const tabs = document.querySelectorAll('.tab-btn');
        const messages = {
            classic: document.getElementById('msgClassic'),
            highroller: document.getElementById('msgHR'),
            multiline: document.getElementById('msgML'),
            wheel: document.getElementById('wheelMsg')
        };

        // Initialize
        function saveState() {
            localStorage.setItem('reelrush-credits', gameState.credits);
            localStorage.setItem('reelrush-prestige', gameState.prestige);
            localStorage.setItem('reelrush-free', gameState.freeSpins);
            localStorage.setItem('reelrush-wagered', gameState.totalWagered);
            localStorage.setItem('reelrush-lastwheel', gameState.lastWheel);
        }

        function updateUI() {
            document.getElementById('credits').textContent = gameState.credits;
            document.getElementById('prestige').textContent = gameState.prestige;
            document.getElementById('freeSpins').textContent = gameState.freeSpins;
            saveState();
        }

        // Tab Switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMode = tab.dataset.mode;
                document.querySelectorAll('.play-area > div').forEach(area => area.classList.add('hidden'));
                document.getElementById(currentMode).classList.remove('hidden');
                updateWheelCooldown();
            });
        });

        // Slot Machine Logic
        function initReels(machine) {
            reelStates[machine] = [];
            for (let i = 0; i < machines[machine].reels; i++) {
                const symbols = [...machines[machine].symbols];
                for (let j = 0; j < 12; j++) {
                    const idx = Math.floor(Math.random() * symbols.length);
                    symbols.splice(idx, 1)[0];
                    symbols.push(symbols[idx]);
                }
                reelStates[machine][i] = symbols;
            }
        }

        function spinSlot(machine) {
            if (spinning) return;
            
            const config = machines[machine];
            const cost = gameState.freeSpins > 0 ? 0 : config.bet;
            
            if (gameState.credits < cost && gameState.freeSpins === 0) {
                messages[machine].textContent = 'Not enough credits!';
                return;
            }

            spinning = true;
            document.getElementById(`spin${machine.charAt(0).toUpperCase() + machine.slice(1)}`).disabled = true;
            messages[machine].textContent = 'SPINNING...';

            if (gameState.freeSpins > 0) gameState.freeSpins--;
            else {
                gameState.credits -= cost;
                gameState.totalWagered += cost;
            }

            for (let i = 0; i < config.reels; i++) {
                setTimeout(() => spinReel(`reel${i+1}-${machine}`, machine, i), i * 150);
            }
        }

        function spinReel(reelId, machine, reelIndex) {
            const spinCount = 20 + Math.floor(Math.random() * 15);
            let spins = 0;
            const config = machines[machine];
            const interval = setInterval(() => {
                const reel = document.getElementById(reelId);
                const state = reelStates[machine][reelIndex];
                const last = state.pop();
                state.unshift(last);
                
                reel.innerHTML = '';
                state.slice(0, 3).forEach(sym => {
                    const div = document.createElement('div');
                    div.className = 'symbol';
                    div.textContent = sym;
                    reel.appendChild(div);
                });

                spins++;
                if (spins >= spinCount) {
                    clearInterval(interval);
                    if (reelIndex === config.reels - 1) checkWin(machine);
                }
            }, 100);
        }

        function checkWin(machine) {
            const config = machines[machine];
            const topRow = reelStates[machine].map(r => r[0]);
            const midRow = reelStates[machine].map(r => r[1]);
            
            let totalPayout = 0;
            
            [topRow, midRow].forEach(line => {
                const sym = line[0];
                if (line.every(s => s === sym)) {
                    totalPayout += config.payout[sym] || 2;
                }
            });

            spinning = false;
            const spinBtn = document.getElementById(`spin${machine.charAt(0).toUpperCase() + machine.slice(1)}`);
            spinBtn.disabled = false;

            if (totalPayout > 0) {
                const payout = totalPayout * config.bet;
                gameState.credits += payout;
                messages[machine].textContent = `JACKPOT! +${payout}cr 🎉`;
                document.querySelectorAll(`#${machine} .symbol`).forEach(s => s.classList.add('win-glow'));
                setTimeout(() => document.querySelectorAll(`#${machine} .symbol`).forEach(s => s.classList.remove('win-glow')), 3000);
            } else {
                messages[machine].textContent = 'Try again!';
            }
            updateUI();
        }

        // Lucky Land Wheel (12 segments w/ BLNT)
        const wheelSegments = [
            {text: '💎500', value: 500, type: 'credits'},
            {text: '🎁100', value: 100, type: 'credits'},
            {text: '💰20', value: 20, type: 'credits'},
            {text: '⭐5Free', value: 5, type: 'freespins'},
            {text: '💎300', value: 300, type: 'credits'},
            {text: '🎁50', value: 50, type: 'credits'},
            {text: '😞BLNT', value: 0, type: 'lose'},
            {text: '🎁200', value: 200, type: 'credits'},
            {text: '💰30', value: 30, type: 'credits'},
            {text: '💎100', value: 100, type: 'credits'},
            {text: '🎁40', value: 40, type: 'credits'},
            {text: '💰15', value: 15, type: 'credits'}
        ];

        function updateWheelCooldown() {
            const now = Date.now();
            const nextSpin = parseInt(gameState.lastWheel) + 4 * 60 * 60 * 1000;
            const timeLeft = Math.max(0, Math.ceil((nextSpin - now) / (60 * 1000)));
            
            const wheelBtn = document.getElementById('spinWheelBtn');
            if (timeLeft > 0) {
                wheelBtn.disabled = true;
                messages.wheel.textContent = `Free spin in ${timeLeft}m`;
            } else {
                wheelBtn.disabled = false;
                messages.wheel.textContent = 'SPIN FREE NOW!';
            }
        }

        function spinWheel() {
            const now = Date.now();
            const nextSpin = parseInt(gameState.lastWheel) + 4 * 60 * 60 * 1000;
            
            if (now < nextSpin) return;
            
            const wheel = document.getElementById('fortuneWheel');
            const wheelBtn = document.getElementById('spinWheelBtn');
            
            wheelBtn.disabled = true;
            messages.wheel.textContent = 'SPINNING...';
            
            const angle = Math.random() * 360 + 1440;
            wheel.style.transition = 'transform 4s cubic-bezier(0.23, 1, 0.32, 1)';
            wheel.style.transform = `rotate(${angle}deg)`;

            setTimeout(() => {
                const normalized = (360 - (angle % 360) + 90) % 360;
                const resultIdx = Math.floor(normalized / 30) % 12;
                const result = wheelSegments[resultIdx];
                
                if (result.type === 'credits') {
                    gameState.credits += result.value;
                    messages.wheel.textContent = `+${result.value} Credits! 🎉`;
                } else if (result.type === 'freespins') {
                    gameState.freeSpins += result.value;
                    messages.wheel.textContent = `+${result.value} Free Spins! ⭐`;
                } else {
                    messages.wheel.textContent = 'Better luck next time! 😞';
                }
                
                gameState.lastWheel = now;
                updateUI();
                updateWheelCooldown();
                wheelBtn.disabled = false;
            }, 4200);
        }

        // Event Listeners
        document.getElementById('spinClassic').addEventListener('click', () => spinSlot('classic'));
        document.getElementById('spinHR').addEventListener('click', () => spinSlot('highroller'));
        document.getElementById('spinML').addEventListener('click', () => spinSlot('multiline'));
        document.getElementById('spinWheelBtn').addEventListener('click', spinWheel);

        // Init
        ['classic', 'highroller', 'multiline'].forEach(m => initReels(m));
        updateUI();
        updateWheelCooldown();
        setInterval(updateWheelCooldown, 30000);

        // Build wheel segments
        wheelSegments.forEach((seg, i) => {
            const segment = document.createElement('div');
            segment.className = 'segment';
            segment.style.transform = `rotate(${i * 30}deg)`;
            segment.textContent = seg.text;
            document.getElementById('fortuneWheel').appendChild(segment);
        });
    </script>
</body>
</html>
